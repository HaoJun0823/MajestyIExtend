name: build-release

# ============================================================================
# MajestyIExtend 汉化补丁构建 + 自动发 Release（ubuntu-latest + msvc-wine 版）
# ----------------------------------------------------------------------------
# 产物（单一 CHS zip，可直接解压到游戏根目录）：
#   MajestyHD-CHS-{date}-{time}.zip
#
# 流程：
#   1. msvc-wine 下载 v141 (14.16) + SDK 26100 → wine 运行 cl.exe 编译
#      MajestyI_StrFix.asi（32 位 x86 DLL，v141_xp 工具集）
#   2. MinHook 1.3.3 从 nuget.org 下载 nupkg 解出 x86 v141 静态库
#   3. tools/build_release.py 将 translated/*.unpacked 重新打包为 CAM/DAT
#      + 复制 Quests/XML/dist/ + 部署 asi → 装配发布目录 → zip
#   4. 体积闸门：asi 必须 34816B（v141_xp + SDK 26100 的确定产物）
#
# 触发：
#   push(master/main)    —— 构建 + 校验 + 上传 zip 到 Artifact + 自动发 Release
#   pull_request        —— 构建 + 校验（门禁，不发布）
#   workflow_dispatch    —— 手动；可勾选跳过 DLL 编译
#
# ★ 与 MajestyIIExtend 同款 msvc-wine 路线（v141 x86 + SDK 26100），但：
#   · 目标 x86 32 位（与 MajestyII 相同），非 x64
#   · MinHook 用 x86-v141-mt（非 x64）
#   · StrFix.asi 体积指纹 34816B（非 144384B）
#   · 单语种 CHS（无 OpenCC 简繁转换步骤）
# ============================================================================

on:
  push:
    branches: [main, master, rebuild]
    paths-ignore:
      - '**.md'
      - 'original/**'
      - 'docs/**'
  pull_request:
    branches: [main, master, rebuild]
    paths-ignore:
      - '**.md'
      - 'original/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_dll:
        description: '跳过 DLL 编译（复用已提交 asi —— CI 上一般不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包（ubuntu-latest + msvc-wine MSVC v141 x86）
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      MSVC_WINE_PREFIX: ${{ github.workspace }}/.msvc
      MSVC_SDK_DIR: ${{ github.workspace }}/.msvc-sdk
      MSVCWINE_REF: master

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # ★ 必须完整 checkout msvc-wine（不能只下 vsdownload.py）：
      #   install.sh 要用仓库里的 lowercase / fixinclude / wrappers /
      #   msvctricks.cpp。
      - name: 检出 msvc-wine
        uses: actions/checkout@v5
        with:
          repository: mstorsjo/msvc-wine
          ref: ${{ env.MSVCWINE_REF }}
          path: .msvc-wine

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── wine 侧依赖（msvc-wine README 的 Prerequisites）──────────────
      - name: 安装 wine / msitools 等依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wine64 msitools ca-certificates winbind
          wine --version

      # ── 工具链缓存（VC 14.16 + SDK 26100 合并后约 4GB）──────────────
      - name: 还原 MSVC 工具链缓存
        uses: actions/cache@v6
        with:
          path: .msvc
          key: mj1-msvcwine-v141-x86-sdk26100-${{ env.MSVCWINE_REF }}-v1

      # ── 下载工具链（缓存未命中时）：两段 vsdownload + 合并 ──────────
      #   段 1（VC 14.16）：--major 15 锁 VS2017 channel 拿 v141。
      #     --architecture x86 x64 两者都要：x86 cl.exe 启动时按 PATH
      #     找 mspdbcore.dll，而 VC 14.16 里它只存在于 Hostx64/x64 目录。
      #   段 2（SDK 26100）：保 34816B 体积指纹的必要条件。
      - name: 下载并装配 MSVC v141 + Win10 SDK 26100（缓存未命中时）
        run: |
          set -euo pipefail
          if [ -x "${MSVC_WINE_PREFIX}/bin/x86/cl" ] && [ -d "${MSVC_WINE_PREFIX}/kits/10/include/10.0.26100.0" ]; then
            echo "工具链缓存命中（VC 14.16 + SDK 26100），跳过下载。"
          else
            echo "==> [1/3] 下载 VC 14.16 (v141, VS2017 channel, x86+x64)"
            python3 .msvc-wine/vsdownload.py \
              --accept-license --major 15 --msvc-version 15.9 \
              --architecture x86 x64 --host-arch x64 \
              --with-sdk=no --with-atl=no --with-asan=no --with-dia=no \
              --with-msbuild=no --with-devcmd=no \
              --dest "${MSVC_WINE_PREFIX}"

            echo "==> [2/3] 下载 Win10 SDK 26100 (VS2022 channel)"
            python3 .msvc-wine/vsdownload.py \
              --accept-license --major 17 \
              --sdk-version 10.0.26100 \
              --with-default=no \
              --architecture x86 --host-arch x64 \
              --dest "${MSVC_SDK_DIR}"

            echo "==> [3/3] 合并 SDK 26100 进 MSVC prefix"
            if [ -d "${MSVC_WINE_PREFIX}/Windows Kits" ]; then
              echo "!! .msvc/Windows Kits 已存在，意外状态" >&2; exit 1
            fi
            mv "${MSVC_SDK_DIR}/Windows Kits" "${MSVC_WINE_PREFIX}/"
          fi
          rm -rf "${MSVC_SDK_DIR}"

      # ── install.sh：大小写修复 + 包装脚本生成（幂等，永远跑）────────
      - name: install.sh（生成包装脚本 / 大小写修复）
        run: |
          set -euo pipefail
          sh .msvc-wine/install.sh "${MSVC_WINE_PREFIX}"

      # ── 编译器验证（门禁 + 诊断）──────────────────────────────────
      - name: 验证编译器为 MSVC v141 x86（诊断 + 门禁）
        run: |
          set -euo pipefail
          export PATH="${MSVC_WINE_PREFIX}/bin/x86:$PATH"
          echo "── mspdbcore.dll 就位检查（C1356 根因诊断）──"
          find "${MSVC_WINE_PREFIX}/vc/tools/msvc" -name mspdbcore.dll 2>/dev/null || true
          echo "── cl banner ──"
          banner="$(cl 2>&1 || true)"
          echo "$banner" | head -2
          if ! echo "$banner" | grep -q "19\.16"; then
            echo "!! cl 不是 MSVC 14.16 (v141) —— vsdownload 可能回退了版本" >&2
            exit 1
          fi
          echo "── Win SDK 版本（应只有 10.0.26100.0）──"
          ls "${MSVC_WINE_PREFIX}/kits/10/include/"
          echo "── 磁盘余量 ──"
          df -h .

      # ── MinHook 1.3.3：nupkg 即 zip，解出 x86 v141 静态库 ──────────
      #   packages/ 在 .gitignore 里，CI 必须自备。
      #   ★ 用 -md 变体（动态 CRT /MD），与 vcxproj 的 /MD 默认匹配；
      #     -mt 变体会触发 /LTCG 拉入静态 CRT 使产物膨胀到 139776B。
      - name: 下载 MinHook 1.3.3 并解压
        run: |
          set -euo pipefail
          curl -fsSL -o minhook.1.3.3.nupkg https://www.nuget.org/api/v2/package/minhook/1.3.3
          rm -rf .minhook_tmp && mkdir .minhook_tmp
          unzip -qo minhook.1.3.3.nupkg -d .minhook_tmp
          # x86 v141 /MD 静态库 + 头文件
          test -f .minhook_tmp/lib/native/lib/libMinHook-x86-v141-md.lib
          test -f .minhook_tmp/lib/native/include/MinHook.h
          mkdir -p packages/minhook.1.3.3
          cp -a .minhook_tmp/lib   packages/minhook.1.3.3/
          cp -a .minhook_tmp/build packages/minhook.1.3.3/
          rm -rf .minhook_tmp minhook.1.3.3.nupkg
          echo "✓ MinHook 1.3.3 (x86-v141-md) 就位"

      # ── 编译 StrFix.asi（cl.exe 直接调用，flags 翻译自 vcxproj）───
      #   Release|Win32 配置 → cl 命令行（仅取影响产物体积的关键 flags）：
      #     /O2(MaxSpeed) /Gy(FunctionLevelLinking) /Oi(IntrinsicFunctions)
      #     /W3(WarningLevel3) /sdl(SDLCheck) /Y-(禁PCH,简化CI)
      #     /utf-8(源码编码) /EHsc(C++异常) /MD(动态CRT,与vcxproj默认一致)
      #     定义: WIN32 NDEBUG MAJESTYISTRFIX_EXPORTS _WINDOWS _USRDLL _CRT_SECURE_NO_WARNINGS
      #     链接: /SUBSYSTEM:WINDOWS /OPT:ICF /OPT:REF
      #           kernel32.lib user32.lib libMinHook-x86-v141-md.lib
      #   ★ 不加 -DEBUG：本地部署的 asi（34816B）无 .debug 段；wine 下 link
      #     加 -DEBUG 会嵌入旧式 .debug 段膨胀体积。
      #   ★ 不加 -SAFESEH 和 -SUBSYSTEM:WINDOWS,5.01：v141_xp 的 /SAFESEH
      #     需要 SDK 7.1A 的 XP CRT（__except_handler4_common），msvc-wine
      #     只有 Win10 SDK 26100 没有它。加 /SAFESEH 会导致链接失败或
      #     /LTCG 拉入静态 CRT 使产物膨胀到 139776B。不加 /SAFESEH 仍产出
      #     34816B（与本地部署版逐字节一致，仅 PE 时间戳不同）。
      #   ★ MinHook .lib 含 /GL（全程序优化），link 会自动重启加 /LTCG，
      #     属正常行为（仅影响链接速度，不影响产物体积）。
      - name: 编译 MajestyI_StrFix.asi
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          export PATH="${MSVC_WINE_PREFIX}/bin/x86:$PATH"
          cd MajestyI_StrFix
          # MinHook 头文件路径
          MH_INC="../packages/minhook.1.3.3/lib/native/include"
          MH_LIB="../packages/minhook.1.3.3/lib/native/lib/libMinHook-x86-v141-md.lib"
          # cl flags（用 '-' 前缀避免 wine 把 '/xxx' 当 Unix 路径）
          cl -nologo -LD -EHsc -Y- -utf-8 -O2 -Gy -Oi -W3 -sdl -MD \
            -D WIN32 -D NDEBUG -D MAJESTYISTRFIX_EXPORTS \
            -D _WINDOWS -D _USRDLL -D _CRT_SECURE_NO_WARNINGS \
            -I. -I"$MH_INC" \
            dllmain.cpp pch.cpp \
            -link -OUT:MajestyI_StrFix.dll \
            -SUBSYSTEM:WINDOWS -OPT:ICF -OPT:REF \
            kernel32.lib user32.lib "$MH_LIB"
          if [ ! -f MajestyI_StrFix.dll ]; then
            echo "!! cl did not produce MajestyI_StrFix.dll" >&2; exit 1
          fi
          cp MajestyI_StrFix.dll MajestyI_StrFix.asi
          echo "✓ asi compiled: $(wc -c < MajestyI_StrFix.asi) B"

      - name: 跳过 DLL 编译（复用已有 asi）
        if: ${{ github.event.inputs.skip_dll == 'true' }}
        run: |
          echo ">> skip_dll=true, looking for committed asi"
          if [ -f dist/MajestyI_StrFix.asi ]; then
            echo "found dist/MajestyI_StrFix.asi ($(wc -c < dist/MajestyI_StrFix.asi) B)"
          elif [ -f MajestyI_StrFix/Release/MajestyI_StrFix.asi ]; then
            echo "found MajestyI_StrFix/Release/MajestyI_StrFix.asi"
          else
            echo "!! no asi found — skip_dll requires a pre-built asi" >&2
            exit 1
          fi

      # ── asi 体积闸门：杜绝错 DLL 流入发布 ──────────────────────────
      # 正确 v141_xp + SDK 26100 asi = **34816B**
      - name: 校验 asi 体积（必须为 34816B v141_xp）
        run: |
          set -euo pipefail
          asi=""
          for p in MajestyI_StrFix/MajestyI_StrFix.asi dist/MajestyI_StrFix.asi MajestyI_StrFix/Release/MajestyI_StrFix.asi; do
            if [ -f "$p" ]; then asi="$p"; break; fi
          done
          if [ -z "$asi" ]; then echo "!! asi not found" >&2; exit 1; fi
          sz=$(wc -c < "$asi")
          echo "asi: $asi = $sz B"
          if [ "$sz" -ne 34816 ]; then
            echo "!! asi = $sz B（应为 34816 B，疑似工具集/SDK 回退）" >&2
            exit 1
          fi
          echo "✓ asi size OK (34816 B)"

      # ── 装配发布包 ────────────────────────────────────────────────
      - name: 运行 build_release.py
        run: |
          set -euo pipefail
          asi=""
          for p in MajestyI_StrFix/MajestyI_StrFix.asi dist/MajestyI_StrFix.asi MajestyI_StrFix/Release/MajestyI_StrFix.asi; do
            if [ -f "$p" ]; then asi="$p"; break; fi
          done
          python3 tools/build_release.py --asi "$asi"

      # ── 上传 Artifact ─────────────────────────────────────────────
      - name: 上传 CHS 发布包
        uses: actions/upload-artifact@v4
        with:
          name: majestyhd-chs
          path: build_out/MajestyHD-CHS-*.zip
          if-no-files-found: error

  # ── 发布：每次 push 成功构建后自动打日期 tag + 发 Release ───────────
  # 复刻 MajestyIIExtend：不再限制分支，rebuild/master/main 均自动发布。
  # 同一 run 内由 gh CLI 直接建 tag + 发 Release，无需手动打 tag。
  publish:
    name: 发布 Release
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出仓库（git tag 需要）
        uses: actions/checkout@v4
      - name: 下载 CHS zip
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 打日期 tag + 发布 Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(date -u '+%Y%m%d-%H%M%S')"
          echo "创建 Release: $tag (target $GITHUB_SHA)"
          gh release create "$tag" \
            dist/majestyhd-chs/MajestyHD-CHS-*.zip \
            --target "$GITHUB_SHA" \
            --title "Majesty HD 简体中文汉化补丁 $tag" \
            --notes "自动构建 CHS 汉化补丁。详见仓库 README。"
          echo "✅ 已发布: $tag"
