[Settings]
; MX(DLC) 单元显示名 —— 运行时映射开关
;   1 = 启用（把 Mausoleum/Outpost/Embassy 等 DLC 单元名替换成中文）
;   0 = 关闭（完全不改动任何字符串；若发现建筑从建造菜单消失，先改成 0 验证是否本功能导致）
; 修改后重启游戏生效。
MxNameDict=1

; EXE 内置 UI 字符串 —— 运行时汉化开关（v1.11）
;   1 = 启用（汉化分辨率设置界面那几条硬编码在 EXE 里的英文）
;       SCREEN RESOLUTION      -> 屏幕分辨率
;       Change Mode            -> 更改模式
;       Resolution Changed     -> 屏幕分辨率已更改
;       Keep the new resolution? -> 保留新的分辨率？
;       The DirectX 9 mode change will be applied on application restart.
;                               -> DirectX 9 模式更改将在重新启动游戏后生效。
;   0 = 关闭
; 译文对齐《王权 2》官方简中术语。修改后重启游戏生效。
UiNameDict=1
