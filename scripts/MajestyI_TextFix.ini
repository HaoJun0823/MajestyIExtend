; MajestyI_TextFix.ini - v12.0 Configuration
; Place in the same directory as the .asi file

[Font]
; TTF file in same directory (empty = use system font)
FontFile=SourceHanSansHWSC-VF.ttf
; Font name (must match the font's internal name)
FontName=Source Han Sans HW SC VF
; Font size in pixels
FontSize=12
; Font weight: 400=Normal, 700=Bold
FontWeight=400

[Render]
; RenderMode: 0=GGO_BITMAP (1bpp, sharp), 1=GGO_GRAY8 (antialiased)
RenderMode=0
; BlendMode: 0=direct write, 1=alpha blend (only with RenderMode=1)
BlendMode=0
; Quality: 0=NONANTIALIASED, 1=ANTIALIASED, 2=CLEARTYPE
Quality=0

[Color]
; Colors in RGB565 hex (16bpp): FFFF=white, 0000=black
FgColor=65535
BgColor=0
; Override game colors (1=use above, 0=use game's fg/bg)
OverrideColor=1

[Position]
; Pixel adjustments
YOffset=0
XOffset=0
; Extra line spacing (added to tmHeight)
LineSpacing=0
; Wrap width in pixels (0=auto use endX-startX, >0=use fixed width)
WrapWidth=0
; Wrap width adjust in auto mode (+/- pixels, e.g. -10 makes text wrap slightly earlier)
WrapWidthAdjust=-12

[Outline]
; Force outline on all text
Enable=0
; Outline width in pixels
Width=1
